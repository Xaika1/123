{% extends "base.html" %}
{% block title %}Товары{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>Товары</h4>
    <a class="btn btn-primary" href="#/products/new"><i class="bi bi-plus-lg me-1"></i>Добавить товар</a>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body py-2">
        <div class="row g-2 align-items-end">
            <div class="col-lg-4">
                <label class="form-label small text-body-secondary mb-0" for="searchInput">Поиск</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control" id="searchInput"
                           placeholder="Название, артикул, место, категория…" value="{{ filters.search }}">
                </div>
            </div>
            <div class="col-lg-2">
                <label class="form-label small text-body-secondary mb-0" for="categoryFilter">Категория</label>
                <select class="form-select" id="categoryFilter">
                    <option value="">Все категории</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if filters.categoryId == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-lg-2">
                <label class="form-label small text-body-secondary mb-0" for="sortSelect">Сортировка</label>
                <select class="form-select" id="sortSelect">
                    <option value="name" {% if filters.sort == 'name' %}selected{% endif %}>По названию</option>
                    <option value="stock" {% if filters.sort == 'stock' %}selected{% endif %}>По остатку</option>
                    <option value="price" {% if filters.sort == 'price' %}selected{% endif %}>По цене</option>
                    <option value="last_receipt" {% if filters.sort == 'last_receipt' %}selected{% endif %}>По дате поступления</option>
                </select>
            </div>
            <div class="col-lg-2">
                <label class="form-label small text-body-secondary mb-0" for="directionSelect">Направление</label>
                <select class="form-select" id="directionSelect">
                    <option value="asc" {% if filters.direction == 'asc' %}selected{% endif %}>По возрастанию</option>
                    <option value="desc" {% if filters.direction == 'desc' %}selected{% endif %}>По убыванию</option>
                </select>
            </div>
            <div class="col-lg-2">
                <div class="form-check mt-1">
                    <input class="form-check-input" type="checkbox" id="archivedToggle"
                           {% if filters.includeArchived %}checked{% endif %}>
                    <label class="form-check-label small" for="archivedToggle">Показывать архив</label>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th></th>
                    <th>Артикул</th>
                    <th>Наименование</th>
                    <th>Категория</th>
                    <th class="text-end">Остаток</th>
                    <th class="text-end">Цена, руб.</th>
                    <th>Место хранения</th>
                    <th>Поступление</th>
                    <th class="text-end text-nowrap">Действия</th>
                </tr>
            </thead>
            <tbody id="productsBody">
                <tr><td colspan="9" class="text-center text-body-secondary py-4">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="card-footer bg-transparent small text-body-secondary" id="productsCount"></div>
</div>
{% endblock %}
