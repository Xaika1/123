<tr data-item-row>
    <td>
        <select class="form-select form-select-sm productSelect" required>
            <option value="">— выберите товар —</option>
            {% for p in products %}
            <option value="{{ p.id }}" data-price="{{ p.price }}" data-stock="{{ p.current_stock }}">
                {{ p.name }} ({{ p.article }}) · остаток {{ p.current_stock }}
            </option>
            {% endfor %}
        </select>
    </td>
    <td>
        <input type="number" class="form-control form-control-sm text-end qtyInput"
               min="1" step="1" value="{{ row.quantity or 1 }}" required>
    </td>
    <td>
        <input type="number" class="form-control form-control-sm text-end priceInput"
               min="0" step="0.01" value="{{ row.price or 0 }}" required>
    </td>
    <td class="text-end sumCell">0.00</td>
    <td class="text-end">
        <button type="button" class="btn btn-sm btn-outline-danger removeItem" title="Удалить строку">
            <i class="bi bi-x-lg"></i>
        </button>
    </td>
</tr>
